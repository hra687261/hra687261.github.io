    experience:
      - company: "[OCamlPro](https://www.ocamlpro.com/)"
        position: R&D Engineer
        date: "Sept 2021 – present"
        highlights:
          - "Conducted studies, implemented prototypes and delivered solutions for industrial and academic clients and partners"
          - "Contributed to multiple open-source projects ([Alt-Ergo](https://github.com/OCamlPro/alt-ergo), [Owi](https://github.com/OCamlPro/owi), [Colibri2](https://colibri.frama-c.com/), [Smtml](https://github.com/formalsec/smtml), [Dolmen](https://github.com/gbury/dolmen), ...)"
          - "Managed relationships with clients and prospects, organized and led technical meetings, and secured funding for R&D projects"
      - company: "[Université Paris-Saclay](https://www.universite-paris-saclay.fr/), [CEA List](https://list.cea.fr/en/)"
        position: "PhD Student (CIFRE PhD, jointly with [OCamlPro](https://www.ocamlpro.com/))"
        date: "Sept 2022 – Oct 2025"
        highlights:
          - "Designed an SMT theory of sequences tailored for the verification of Ada programs"
          - "Authored and co-authored multiple research papers (see Publications)"
          - "Implemented multiple calculi to reason over SMT problems using (n-indexed) sequences and a difference logic engine"
          - "Developed the labeled union-find data structure and used it both to reason over SMT sequences and to implement a new interval domain for real and integer arithmetic based on it"
      - company: "[OCamlPro](https://www.ocamlpro.com/)"
        position: R&D Intern
        date: "Mar 2021 – Sept 2021"
        highlights:
          - "Developed [Alt-Ergo-Fuzz](https://github.com/hra687261/alt-ergo-fuzz), a fuzzer for the [Alt-Ergo](https://github.com/OCamlPro/alt-ergo) SMT solver, published at JFLA 2022"
          - "Implemented context reinitialization in [Alt-Ergo](https://github.com/OCamlPro/alt-ergo), making it possible to reuse one running instance for multiple problems"
          - "Found both runtime and subtle soundness bugs, most of which have been fixed since"

