    summary:
      - "Formal methods researcher and engineer, with 5 years of experience
        working at a French R&D consultancy, conducting studies, implementing
        prototypes and delivering solutions to industrial and academic clients
        and partners. Author and co-author of multiple publications at venues
        including PLDI, TACAS, and LPAR, and contributor to multiple
        open-source projects."

